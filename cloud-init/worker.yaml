#cloud-config
# Serveur « worker » GHosteo (instances clientes) — Scaleway, Ubuntu 24.04.
# Appliqué une seule fois, au premier démarrage, par scripts/create-server.py.
# Aucun secret ici.
#
# Différence avec control.yaml : ce fichier n'installe NI Docker NI Dokploy. C'est le
# panneau Dokploy (control-01) qui, en attachant le serveur (server.setup), installe
# Docker, initialise le swarm, pose Traefik et le réseau dokploy-network. Installer
# Docker ici d'avance (paquet Ubuntu docker.io) entrerait en conflit avec l'installation
# que fait Dokploy (get.docker.com).
#
# Les clés SSH (Beelink + clé dédiée de Dokploy) sont passées par des tags
# AUTHORIZED_KEY=… sur le serveur, lus à chaque démarrage par l'agent Scaleway
# (voir control.yaml et SUIVI.md, note du 10/09/2026). create-server.py s'en charge.
#
# Ce que fait ce fichier :
#   - accès SSH root par clé uniquement (mot de passe refusé)
#   - fuseau Europe/Paris, 2 Go de swap (la machine n'en a pas par défaut)
#   - mises à jour de sécurité automatiques, sans redémarrage automatique
#   - fail2ban sur SSH
#   - ufw : 22, 80, 443 ouverts, tout le reste refusé pour les services de l'hôte.
#     Rappel : ufw ne gouverne PAS les ports publiés par Docker ; c'est le groupe de
#     sécurité Scaleway (create-server.py) qui restreint le port 22 aux adresses du
#     panneau et de la maison.

hostname: worker-01
timezone: Europe/Paris
locale: fr_FR.UTF-8

disable_root: false
ssh_pwauth: false

package_update: true
package_upgrade: true
packages:
  - ca-certificates
  - curl
  - ufw
  - fail2ban
  - unattended-upgrades
  - apt-listchanges

swap:
  filename: /swapfile
  size: 2G
  maxsize: 2G

write_files:
  - path: /etc/ssh/sshd_config.d/90-ghosteo.conf
    permissions: "0644"
    content: |
      PermitRootLogin prohibit-password
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      X11Forwarding no
  - path: /etc/fail2ban/jail.d/sshd.local
    permissions: "0644"
    content: |
      [sshd]
      enabled = true
      backend = systemd
      maxretry = 5
      findtime = 10m
      bantime = 1h
  - path: /etc/apt/apt.conf.d/52-ghosteo-unattended.conf
    permissions: "0644"
    content: |
      // Mises à jour de sécurité seules, pas de redémarrage automatique :
      // un redémarrage d'un serveur de clients se planifie, il ne se subit pas.
      Unattended-Upgrade::Automatic-Reboot "false";
      Unattended-Upgrade::Remove-Unused-Dependencies "true";
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";
  - path: /etc/sysctl.d/90-ghosteo.conf
    permissions: "0644"
    content: |
      vm.swappiness = 10

runcmd:
  - sysctl --system
  - systemctl restart ssh
  - systemctl enable --now fail2ban
  # Pare-feu de l'hôte, activé AVANT Docker (installé plus tard par Dokploy).
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw allow 443/udp
  - ufw --force enable
  - touch /var/lib/cloud/ghosteo-worker-ready

final_message: "worker-01 prêt après $UPTIME s (cloud-init $VERSION)"
